name: Release

# À chaque tag v* (ex. v1.0.0) : build complet de l'app macOS + DMG,
# puis création/ mise à jour de la GitHub Release avec le DMG en asset.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build app (frontend → Go → Electron)
        run: |
          cd desktop && ./build.sh

      - name: Build DMG
        run: |
          cd desktop && ./make-dmg.sh "${GITHUB_REF_NAME#v}"

      - name: Create / update GitHub Release with DMG
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/Soneph-*.dmg
          generate_release_notes: true
