version: '3.8'

services:
  # Backend Go + Python + download engine — serves both the API (:8080)
  # and the embedded Vite frontend on the same port.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: soneph-backend
    ports:
      - "8080:8080"
    volumes:
      - ./downloads:/app/downloads
    environment:
      - DOWNLOAD_DIR=/app/downloads
      - PORT=8080
      # Optional: protect the API with a token (set it in your .env file)
      - SONEPH_TOKEN=${SONEPH_TOKEN:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # Syncthing P2P Auto-Sync Engine
  syncthing:
    image: syncthing/syncthing:latest
    container_name: soneph-syncthing
    hostname: soneph-vps
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ./downloads:/var/syncthing/downloads
      - ./syncthing_config:/var/syncthing/config
    ports:
      - "8384:8384"       # Syncthing Web GUI
      - "22000:22000/tcp" # Sync Protocol TCP
      - "22000:22000/udp" # Sync Protocol QUIC
      - "21027:21027/udp" # Local Discovery
    restart: unless-stopped
