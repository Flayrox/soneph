version: '3.8'

services:
  # Backend Go + Python + spotdl
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soneph-backend
    ports:
      - "8080:8080"
    volumes:
      - ./downloads:/app/downloads
    environment:
      - DOWNLOAD_DIR=/app/downloads
      - PORT=8080
    restart: unless-stopped

  # Frontend Dashboard Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: soneph-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # Syncthing P2P Auto-Sync Engine
  syncthing:
    image: syncthing/syncthing:latest
    container_name: soneph-syncthing
    hostname: soneph-vps
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ./downloads:/var/syncthing/downloads
      - ./syncthing_config:/var/syncthing/config
    ports:
      - "8384:8384"       # Syncthing Web GUI
      - "22000:22000/tcp" # Sync Protocol TCP
      - "22000:22000/udp" # Sync Protocol QUIC
      - "21027:21027/udp" # Local Discovery
    restart: unless-stopped

volumes:
  downloads:
